<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kinderland Day Nursery — DeBrand Progress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    /* ByDeesign brand palette */
    --paper: #FFFFFF;
    --bg: #FCFCFA;
    --ink: #17150F;
    --ink-soft: #6E6A5F;
    --orange: #E2521A;
    --terracotta: #CB5F2D;
    --periwinkle: #B7C4EA;
    --blue: #7C93CE;
    --olive: #C6CB57;
    --lime: #E7EB69;
    --sage: #5C7568;
    --warmgray: #83806E;
    --rule: #E7E4DA;

    --font-display: 'Libre Baskerville', Georgia, 'Times New Roman', serif;
    --font-sans: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-script: 'Caveat', cursive;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 780px;
    margin: 0 auto;
    padding: 48px 24px 96px;
  }

  .eyebrow {
    font-family: var(--font-sans);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--warmgray);
    font-weight: 700;
    margin: 0 0 6px;
  }

  .hero {
    display: flex;
    align-items: center;
    gap: 32px;
    padding-bottom: 36px;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 32px;
  }

  .ring-wrap {
    position: relative;
    width: 128px;
    height: 128px;
    flex-shrink: 0;
  }

  .ring-wrap svg { transform: rotate(-90deg); }

  .ring-track { fill: none; stroke: #EFEDE4; stroke-width: 10; }
  .ring-progress {
    fill: none;
    stroke: var(--orange);
    stroke-width: 10;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.6s ease;
  }

  .ring-label {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }

  .ring-pct {
    font-family: var(--font-display);
    font-size: 30px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1;
  }

  .ring-sub {
    font-family: var(--font-sans);
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-top: 3px;
  }

  .hero-text h1 {
    font-family: var(--font-display);
    font-size: 30px;
    line-height: 1.18;
    color: var(--ink);
    margin: 0 0 8px;
  }

  .hero-text h1 .accent {
    color: var(--olive);
    background: var(--ink);
    padding: 0 6px;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }

  .hero-text p {
    margin: 0;
    color: var(--ink-soft);
    font-size: 15px;
    line-height: 1.5;
  }

  .hero-count {
    font-weight: 700;
    color: var(--ink);
  }

  .waiting {
    background: #FBEFE7;
    border-left: 3px solid var(--terracotta);
    border-radius: 4px;
    padding: 18px 22px;
    margin-bottom: 36px;
  }

  .waiting h2 {
    font-family: var(--font-sans);
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin: 0 0 10px;
    color: var(--terracotta);
    font-weight: 700;
  }

  .waiting ul { margin: 0; padding-left: 18px; }
  .waiting li { font-size: 14.5px; line-height: 1.6; color: var(--ink); }

  .section {
    border-bottom: 1px solid var(--rule);
  }

  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 4px;
    cursor: pointer;
    user-select: none;
  }

  .section-head-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .section-bar {
    width: 4px;
    height: 30px;
    border-radius: 2px;
  }

  .section-title {
    font-family: var(--font-display);
    font-size: 19px;
    color: var(--ink);
    margin: 0;
  }

  .section-frac {
    font-family: var(--font-sans);
    font-size: 12.5px;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
    font-weight: 600;
  }

  .section-right {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .chevron {
    width: 10px;
    height: 10px;
    border-right: 2px solid var(--ink-soft);
    border-bottom: 2px solid var(--ink-soft);
    transform: rotate(45deg);
    transition: transform 0.25s ease;
    margin-right: 4px;
  }

  .section.open .chevron { transform: rotate(-135deg); }

  .items {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease;
  }

  .section.open .items { max-height: 800px; }

  .item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 10px 4px 10px 18px;
  }

  .item-label-wrap {
    flex: 1;
    display: flex;
    align-items: flex-start;
    gap: 8px;
    min-width: 0;
  }

  .item-input {
    flex: 1;
    font-size: 14.5px;
    font-family: inherit;
    line-height: 1.5;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--blue);
    border-radius: 4px;
    padding: 4px 8px;
    margin: -5px 0;
  }

  .edit-btn {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.15s ease, background 0.15s ease;
  }

  .item:hover .edit-btn { opacity: 0.55; }
  .edit-btn:hover { opacity: 1 !important; background: #EFE7D8; }

  .edit-btn svg { width: 13px; height: 13px; }

  .delete-btn {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.15s ease, background 0.15s ease;
  }

  .item:hover .delete-btn { opacity: 0.4; }
  .delete-btn:hover { opacity: 1 !important; background: #F6E3DD; }
  .delete-btn svg { width: 12px; height: 12px; }

  .add-item-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 4px 16px 18px;
  }

  .add-item-trigger {
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    cursor: pointer;
    padding: 4px 2px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .add-item-trigger:hover { color: var(--ink); }

  .add-item-trigger .plus {
    width: 16px;
    height: 16px;
    border: 1.5px dashed var(--ink-soft);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    line-height: 1;
  }

  .add-item-input {
    flex: 1;
    font-size: 14.5px;
    font-family: inherit;
    line-height: 1.5;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--sage);
    border-radius: 4px;
    padding: 6px 8px;
  }

  .checkbox {
    flex-shrink: 0;
    width: 19px;
    height: 19px;
    border: 2px solid var(--sage);
    border-radius: 4px;
    margin-top: 1px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, border-color 0.15s ease;
    background: transparent;
  }

  .checkbox.done {
    background: var(--sage);
    border-color: var(--sage);
  }

  .checkbox svg { width: 12px; height: 12px; opacity: 0; transition: opacity 0.15s ease; }
  .checkbox.done svg { opacity: 1; }

  .item-label {
    font-size: 14.5px;
    line-height: 1.5;
    color: var(--ink);
    cursor: pointer;
    padding-top: 0px;
  }

  .item-label.done {
    color: var(--ink-soft);
    text-decoration: line-through;
    text-decoration-color: #C9C0B2;
  }

  .footer {
    margin-top: 44px;
    padding-top: 24px;
    border-top: 1px solid var(--rule);
    font-size: 13px;
    color: var(--ink-soft);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .footer-note {
    font-family: var(--font-script);
    font-size: 17px;
    color: var(--warmgray);
  }

  .sync-tag {
    font-family: var(--font-sans);
    font-size: 10.5px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--ink-soft);
    background: var(--paper);
    border: 1px solid var(--rule);
    padding: 4px 10px;
    border-radius: 10px;
  }

  @media (max-width: 520px) {
    .hero { flex-direction: column; align-items: flex-start; gap: 18px; }
    .footer { flex-direction: column; align-items: flex-start; gap: 8px; }
  }
</style>
</head>
<body>

<div class="wrap">

  <p class="eyebrow">ByDeesign — Project KIN01</p>
  <div class="hero">
    <div class="ring-wrap">
      <svg width="128" height="128" viewBox="0 0 128 128">
        <circle class="ring-track" cx="64" cy="64" r="54"></circle>
        <circle id="ringProgress" class="ring-progress" cx="64" cy="64" r="54"
          stroke-dasharray="339.3" stroke-dashoffset="339.3"></circle>
      </svg>
      <div class="ring-label">
        <div class="ring-pct" id="ringPct">0%</div>
        <div class="ring-sub">delivered</div>
      </div>
    </div>
    <div class="hero-text">
      <h1>Kinderland Day Nursery<br><span class="accent">DeBrand Progress</span></h1>
      <p><span class="hero-count" id="itemCount">0 of 0</span> scope items complete. Home from the start.</p>
    </div>
  </div>

  <div class="waiting" id="waitingBox" style="display:none;">
    <h2>Waiting on Esther</h2>
    <ul id="waitingList"></ul>
  </div>

  <div id="sections"></div>

  <div class="footer">
    <span class="footer-note">Tap an item to check it off, or hover and use the pencil to edit its text. Updates for everyone viewing this page.</span>
    <span class="sync-tag" id="syncTag">saved</span>
  </div>

</div>

<script>
const STORAGE_KEY = "kin01-scope-checklist-v3";

const DEFAULT_DATA = [
  {
    id: "logo",
    title: "Logo suite",
    color: "var(--ink)",
    items: [
      { id: "logo-1", text: "Primary mark confirmed (character illustration family)", done: true },
      { id: "logo-2", text: "Wordmark updated to include \u201cDay\u201d (Kinderland Day Nursery)", done: true },
      { id: "logo-3", text: "Est. 1995 heritage device incorporated", done: true },
      { id: "logo-4", text: "Full mark variations — horizontal, stacked, icon-only/favicon", done: false },
      { id: "logo-5", text: "Single-colour and reversed (white-out) versions", done: false },
      { id: "logo-6", text: "Minimum size and clear space rules", done: false },
      { id: "logo-7", text: "Final production files (vector, PNG, EPS export set)", done: false }
    ]
  },
  {
    id: "colour",
    title: "Colour palette",
    color: "var(--orange)",
    items: [
      { id: "colour-1", text: "Palette confirmed — Bluebell, Wisteria, Sage, Terracotta, Forest Green, Mustard, Cream", done: true },
      { id: "colour-2", text: "Formal palette sheet with hex, RGB and CMYK values", done: true }
    ]
  },
  {
    id: "type",
    title: "Typography",
    color: "var(--blue)",
    items: [
      { id: "type-1", text: "Font 2 confirmed as primary typeface", done: true },
      { id: "type-2", text: "Esther's preference within font 2 clarified (letterform vs weight/shape)", done: true },
      { id: "type-3", text: "Secondary / body font pairing confirmed", done: true },
      { id: "type-4", text: "Type hierarchy defined (headings, body, captions)", done: true }
    ]
  },
  {
    id: "guidelines",
    title: "Brand guidelines document",
    color: "var(--olive)",
    items: [
      { id: "guide-1", text: "Mini brand guide — one-page cheat sheet (ready and set up in Canva)", done: true },
      { id: "guide-2", text: "Full brand guidelines document — logo usage, colour, type, tone of voice, heritage device, no-faces rule", done: false }
    ]
  },
  {
    id: "website",
    title: "Showit website",
    color: "var(--terracotta)",
    items: [
      { id: "web-1", text: "Website copy review and approval (needed before go-live)", done: false, waiting: true },
      { id: "web-2", text: "Homepage design", done: true },
      { id: "web-3", text: "Inner pages — About, Rooms/Sites (South & Central), Fees, Contact", done: true },
      { id: "web-4", text: "Booking calendar integration", done: false },
      { id: "web-5", text: "Email capture / automation sequence", done: false },
      { id: "web-6", text: "Review round with Esther", done: false },
      { id: "web-8", text: "Showit business account set up in Esther's name, with Dee added as admin (needed before go-live)", done: false, waiting: true },
      { id: "web-9", text: "Parent info, meal plans and routines (for the website and welcome pack)", done: false, waiting: true },
      { id: "web-10", text: "Inquiry form embed code (to connect the website enquiry form)", done: false, waiting: true },
      { id: "web-11", text: "Room photos for the website (no children's faces)", done: false, waiting: true },
      { id: "web-7", text: "Hosting / account handover to Esther's ownership", done: false }
    ]
  },
  {
    id: "canva",
    title: "Canva template suite",
    color: "var(--periwinkle)",
    items: [
      { id: "canva-4", text: "Canva Business account access shared with Dee (to set up brand kit)", done: true },
      { id: "canva-5", text: "Canva brand kit set up — logos, colours, fonts", done: true },
      { id: "canva-1", text: "Social post templates", done: false },
      { id: "canva-2", text: "Parent comms templates", done: false },
      { id: "canva-3", text: "Welcome pack template", done: false }
    ]
  },
  {
    id: "print",
    title: "Print and signage assets",
    color: "var(--sage)",
    items: [
      { id: "print-1", text: "Site signage for South", done: false },
      { id: "print-2", text: "Site signage for Central", done: false },
      { id: "print-4", text: "Guttering check at the sites, to confirm signage install options", done: false, waiting: true },
      { id: "print-3", text: "Confirm full print/collateral list with Esther", done: false },
      { id: "print-5", text: "Merch sample tees — colour check on arrival, then intro to Han for merch details", done: false }
    ]
  }
];

let state = null;
let editingItemId = null;
let addingToSectionId = null;

function makeItemId(sectionId) {
  return sectionId + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

function cloneDefault() {
  return JSON.parse(JSON.stringify(DEFAULT_DATA));
}

async function loadState() {
  try {
    const result = await window.storage.get(STORAGE_KEY, true);
    if (result && result.value) {
      state = JSON.parse(result.value);
      return;
    }
  } catch (e) {
    // key doesn't exist yet
  }
  state = cloneDefault();
  await saveState();
}

async function saveState() {
  const tag = document.getElementById("syncTag");
  if (tag) tag.textContent = "saving…";
  try {
    await window.storage.set(STORAGE_KEY, JSON.stringify(state), true);
    if (tag) tag.textContent = "saved";
  } catch (e) {
    if (tag) tag.textContent = "offline";
  }
}

function countTotals() {
  let total = 0, done = 0;
  state.forEach(section => {
    section.items.forEach(item => {
      total++;
      if (item.done) done++;
    });
  });
  return { total, done };
}

function render() {
  const { total, done } = countTotals();
  const pct = total ? Math.round((done / total) * 100) : 0;

  document.getElementById("ringPct").textContent = pct + "%";
  document.getElementById("itemCount").textContent = done + " of " + total;

  const circumference = 339.3;
  const offset = circumference - (pct / 100) * circumference;
  document.getElementById("ringProgress").style.strokeDashoffset = offset;

  const waitingItems = [];
  state.forEach(section => {
    section.items.forEach(item => {
      if (item.waiting && !item.done) waitingItems.push(item.text);
    });
  });
  const waitingBox = document.getElementById("waitingBox");
  const waitingList = document.getElementById("waitingList");
  if (waitingItems.length) {
    waitingBox.style.display = "block";
    waitingList.innerHTML = waitingItems.map(t => "<li>" + t + "</li>").join("");
  } else {
    waitingBox.style.display = "none";
  }

  const sectionsEl = document.getElementById("sections");
  sectionsEl.innerHTML = "";

  state.forEach((section, sIdx) => {
    const sDone = section.items.filter(i => i.done).length;
    const sTotal = section.items.length;

    const sectionEl = document.createElement("div");
    sectionEl.className = "section" + (section._open ? " open" : "");

    const head = document.createElement("div");
    head.className = "section-head";
    head.innerHTML =
      '<div class="section-head-left">' +
        '<div class="section-bar" style="background:' + section.color + '"></div>' +
        '<h3 class="section-title">' + section.title + '</h3>' +
      '</div>' +
      '<div class="section-right">' +
        '<span class="section-frac">' + sDone + ' / ' + sTotal + '</span>' +
        '<span class="chevron"></span>' +
      '</div>';
    head.onclick = () => {
      section._open = !section._open;
      render();
    };

    const itemsEl = document.createElement("div");
    itemsEl.className = "items";

    section.items.forEach((item, iIdx) => {
      const row = document.createElement("div");
      row.className = "item";

      const box = document.createElement("div");
      box.className = "checkbox" + (item.done ? " done" : "");
      box.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5L9.5 18L20 6" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';

      const toggle = async () => {
        item.done = !item.done;
        render();
        await saveState();
      };
      box.onclick = (e) => { e.stopPropagation(); toggle(); };

      const labelWrap = document.createElement("div");
      labelWrap.className = "item-label-wrap";

      const isEditing = editingItemId === item.id;

      if (isEditing) {
        const input = document.createElement("input");
        input.type = "text";
        input.className = "item-input";
        input.value = item.text;

        const commit = async () => {
          const newText = input.value.trim();
          if (newText) item.text = newText;
          editingItemId = null;
          render();
          await saveState();
        };

        input.onkeydown = (e) => {
          if (e.key === "Enter") { e.preventDefault(); commit(); }
          if (e.key === "Escape") { editingItemId = null; render(); }
        };
        input.onblur = commit;
        input.onclick = (e) => e.stopPropagation();

        labelWrap.appendChild(input);
        setTimeout(() => { input.focus(); input.select(); }, 0);
      } else {
        const label = document.createElement("div");
        label.className = "item-label" + (item.done ? " done" : "");
        label.style.flex = "1";
        label.textContent = item.text;
        label.onclick = (e) => { e.stopPropagation(); toggle(); };

        const editBtn = document.createElement("div");
        editBtn.className = "edit-btn";
        editBtn.title = "Edit text";
        editBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4z" stroke="' + section.color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>';
        editBtn.onclick = (e) => {
          e.stopPropagation();
          editingItemId = item.id;
          render();
        };

        const deleteBtn = document.createElement("div");
        deleteBtn.className = "delete-btn";
        deleteBtn.title = "Remove item";
        deleteBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path d="M5 5l14 14M19 5L5 19" stroke="#B4614A" stroke-width="2" stroke-linecap="round"/></svg>';
        deleteBtn.onclick = async (e) => {
          e.stopPropagation();
          section.items = section.items.filter(i => i.id !== item.id);
          render();
          await saveState();
        };

        labelWrap.appendChild(label);
        labelWrap.appendChild(editBtn);
        labelWrap.appendChild(deleteBtn);
      }

      row.appendChild(box);
      row.appendChild(labelWrap);
      itemsEl.appendChild(row);
    });

    // add-item row
    const addRow = document.createElement("div");
    addRow.className = "add-item-row";

    if (addingToSectionId === section.id) {
      const input = document.createElement("input");
      input.type = "text";
      input.className = "add-item-input";
      input.placeholder = "New checklist item…";

      const commitAdd = async () => {
        const text = input.value.trim();
        if (text) {
          section.items.push({ id: makeItemId(section.id), text, done: false });
        }
        addingToSectionId = null;
        render();
        if (text) await saveState();
      };

      input.onkeydown = (e) => {
        if (e.key === "Enter") { e.preventDefault(); commitAdd(); }
        if (e.key === "Escape") { addingToSectionId = null; render(); }
      };
      input.onblur = commitAdd;
      input.onclick = (e) => e.stopPropagation();

      addRow.appendChild(input);
      setTimeout(() => input.focus(), 0);
    } else {
      const trigger = document.createElement("div");
      trigger.className = "add-item-trigger";
      trigger.innerHTML = '<span class="plus">+</span><span>Add item</span>';
      trigger.onclick = (e) => {
        e.stopPropagation();
        addingToSectionId = section.id;
        render();
      };
      addRow.appendChild(trigger);
    }

    itemsEl.appendChild(addRow);

    sectionEl.appendChild(head);
    sectionEl.appendChild(itemsEl);
    sectionsEl.appendChild(sectionEl);
  });
}

(async () => {
  // open the first section with incomplete items by default
  await loadState();
  const firstIncomplete = state.find(s => s.items.some(i => !i.done));
  if (firstIncomplete) firstIncomplete._open = true;
  render();
})();
</script>

</body>
</html>
